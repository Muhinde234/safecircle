spring:
  application:
    name: safecircle-backend

  profiles:
    # Default profile for local development.
    # Override with: SPRING_PROFILES_ACTIVE=prod
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  # Common default port. Profile files can override this.
  port: 8089

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Common actuator exposure can stay minimal at first.
management:
  endpoints:
    web:
      exposure:
        include: health,info
